tester: search_based  # or 'fuzzing', 'bayesian_optimization', etc.

common:
  seed: None
  termination: "n_gen"
  budget: 100


search_based:
  pop_size: 100
  algorithm: "ga"
  crossover: "sbx"
  mutation: "pm"
  crossover_prob: 0.9
  mutation_prob: 0.4
  problem_name: 'uav'

fuzzing:
  mutators: ["bitflip", "shrink"]
  max_depth: 5

bayesian_optimization:
  acquisition: "ei"
  surrogate_model: "gp"


experiment:
  name: "example_experiment-sbx-pm"
  description: "This is an example experiment configuration."
  output_dir: "./results"
  log_level: "info"
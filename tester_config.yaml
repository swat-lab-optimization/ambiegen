tester: search_based  # or 'fuzzing', 'bayesian_optimization', etc.

common:
  seed: None
  termination: "n_gen"
  budget: 100

search_based:
  pop_size: 100
  algorithm: "ga"
  crossover: "sbx"
  mutation: "pm"
  crossover_prob: 0.9
  mutation_prob: 0.4
  problem_name: 'uav'

fuzzing:
  algorithm: "ga"
  problem_name: 'uav'
  max_depth: 5
  min_depth: 1


experiment:
  name: "example_experiment-sbx-pm"
  description: "This is an example experiment configuration."
  output_dir: "experiments"
  log_level: "info"